server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Avatars are up to 2 MB; the API enforces the exact limit
  client_max_body_size 3m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API: same origin for the browser, so no CORS needed
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets can be cached for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths return index.html so client routes work on refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
